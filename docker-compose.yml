services:

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: margametis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margametis}
      POSTGRES_DB: margametis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margametis -d margametis"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://margametis:${POSTGRES_PASSWORD:-margametis}@postgres:5432/margametis
      SECRET_KEY: margametis-dev-secret
      FLASK_ENV: development
      TRUSTED_PROXY_COUNT: 0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - graph_cache:/app/backend/graph_cache
      - route_cache:/app/backend/cache
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:5050/api
    restart: unless-stopped
    ports:
      - "3030:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  graph_cache:
  route_cache:
  logs:

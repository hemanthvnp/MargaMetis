# One command runs everything:
#
#     docker compose up --build
#
# then open http://localhost:3030 (app) and http://localhost:3030/spatial.
# The first run builds the images and loads the road network and places into
# PostGIS (a few minutes); later runs start in seconds. Host ports can be moved
# if they clash with something else, e.g.  BACKEND_PORT=5055 FRONTEND_PORT=3031

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://margametis:${POSTGRES_PASSWORD:-margametis}@postgres:5432/margametis

services:

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: margametis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margametis}
      POSTGRES_DB: margametis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margametis -d margametis"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Only the backend talks to Redis, so it needs no host port (6379 is often taken).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: *backend-build
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    environment:
      <<: *backend-env
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-margametis-dev-secret}
      FLASK_ENV: development
      TRUSTED_PROXY_COUNT: 0
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3030}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - graph_cache:/app/backend/graph_cache
      - route_cache:/app/backend/cache
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: waits for the backend (which applies the migrations on start),
  # loads the data if the tables are empty, then exits.
  seed:
    build: *backend-build
    restart: "no"
    healthcheck:
      disable: true   # one-shot job; the image's web healthcheck does not apply
    command: ["python", "/app/scripts/seed_local_data.py"]
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-5050}/api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  graph_cache:
  route_cache:
  logs:

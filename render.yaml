services:
  - type: web
    name: margametis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Neon Postgres (PostGIS). Set the direct, non-pooled connection
      # string in the Render dashboard; the pooler rejects startup options.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: margametis-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: CORS_ORIGINS
        value: "https://marga-metis.vercel.app"
      - key: GROQ_API_KEY
        sync: false

  - type: redis
    name: margametis-redis
    plan: free
    ipAllowList: []


services:
  - type: web
    name: margametis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: margametis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: margametis-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: CORS_ORIGINS
        value: "https://marga-metis.vercel.app"
      - key: GROQ_API_KEY
        sync: false

  - type: redis
    name: margametis-redis
    plan: free
    ipAllowList: []

databases:
  - name: margametis-db
    databaseName: margametis
    plan: free

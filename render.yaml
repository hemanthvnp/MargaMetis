services:
  - type: web
    name: margametis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: margametis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: margametis-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: margametis-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: margametis-db
    databaseName: margametis
    plan: free

  - name: margametis-redis
    plan: free
